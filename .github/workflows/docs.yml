name: docs
on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to deploy (e.g. v2.16.2)'
        required: true
      version:
        description: 'Version label to publish under (e.g. 2.16.2)'
        required: true
      alias:
        description: 'Alias to apply (e.g. latest). Leave blank for none.'
        required: false
        default: ''
      set_default:
        description: 'Set this alias as the default redirect'
        required: false
        default: 'false'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install zensical git+https://github.com/squidfunk/mike.git
      - name: Configure git
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy dev (branch push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: mike deploy --push --update-aliases dev
      - name: Deploy tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest
      - name: Manual deploy
        if: github.event_name == 'workflow_dispatch'
        run: |
          ALIAS="${{ github.event.inputs.alias }}"
          if [ -n "$ALIAS" ]; then
            mike deploy --push --update-aliases "${{ github.event.inputs.version }}" "$ALIAS"
          else
            mike deploy --push "${{ github.event.inputs.version }}"
          fi
          if [ "${{ github.event.inputs.set_default }}" = "true" ] && [ -n "$ALIAS" ]; then
            mike set-default --push "$ALIAS"
          fi
