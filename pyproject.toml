[project]
name = "autolume"
version = "2.17.0"
description = "Autolume is a no-coding generative AI system allowing artists to train, craft, and explore their own models."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "click>=8.1.8",
    "codecarbon>=3.2.6",
    "fbpca==1.0",
    "ffmpeg-downloader>=0.5.2",
    "ffmpeg-python==0.2.0",
    "filedialpy==1.3.4",
    "glfw>=2.8.0",
    "imageio-ffmpeg==0.4.9",
    "imageio==2.31.5",
    "imgui==1.4.1",
    "kmeans-pytorch==0.3",
    "kornia==0.7.0",
    "lmdb==1.5.1",
    "lpips==0.1.4",
    "matplotlib==3.8.0",
    "ndi-python==6.3.2.3",
    "ninja==1.11.1.1",
    "numpy==1.26.4",
    "openai-clip==1.0.1",
    "opencv-python-headless==4.8.1.78",
    "opensimplex==0.4.5",
    "packaging>=26.2",
    "pillow==10.4.0",
    "psutil>=6.0.0",
    "pyinstaller==6.16.0",
    "pyopengl==3.1.7",
    "pyspng==0.1.3",
    "python-osc==1.8.3",
    "pyyaml>=6.0.2",
    "requests>=2.30",
    "scikit-image==0.22.0",
    "scikit-learn==1.3.1",
    "scipy==1.11.3",
    "setuptools<70",
    "sounddevice==0.5.5",
    "timm==0.5.4",
    "torch==2.8.0 ; sys_platform == 'darwin'",
    "torch==2.8.0+cu128 ; sys_platform != 'darwin'",
    "torchvision==0.23.0 ; sys_platform == 'darwin'",
    "torchvision==0.23.0+cu128 ; sys_platform != 'darwin'",
    "tqdm==4.66.1",
    "zensical==0.0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autolume", "src/dnnlib", "src/torch_utils"]

[tool.uv]
# Homebrew/system interpreters bake the build machine's OS version into
# compiled stdlib modules and linked libs, breaking the release's declared
# minimum OS. Managed (python-build-standalone) interpreters target macOS 11+.
python-preference = "only-managed"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# On macOS there are no CUDA builds; torch comes from PyPI (arm64 wheels with MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
filedialpy = { git = "https://github.com/ucodia/filedialpy.git", tag = "v1.3.4-fixes" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
